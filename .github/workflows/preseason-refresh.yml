name: preseason-squad-refresh
on:
  schedule:
    - cron: "0 6 20 7 *"   # July 20, 06:00 UTC — before the new season kicks off
  workflow_dispatch:        # manual trigger fallback

jobs:
  run:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from Oct 2026
    timeout-minutes: 30   # single roster page; anything longer means a wedged browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: ~/soccerdata
          key: soccerdata-${{ github.run_number }}
          restore-keys: soccerdata-
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pipeline.src.seasons --refresh-squads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
