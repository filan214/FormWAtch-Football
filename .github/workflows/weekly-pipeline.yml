name: weekly-pipeline
on:
  # Runs twice weekly (not just once) to keep a safety margin under
  # Supabase's 7-day inactivity pause threshold — see incident Jun 23, 2026
  schedule:
    - cron: "0 6 * * 2,5"   # Tuesdays + Fridays 06:00 UTC, after weekend + Monday fixtures
  workflow_dispatch:        # manual trigger fallback

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # browser scraping can wedge; don't burn 6h of runner time
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/soccerdata
          key: soccerdata-${{ github.run_number }}
          restore-keys: soccerdata-
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pipeline.src.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
